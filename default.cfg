; FabricRouting — Fabric Routing (FRR)
; Live: /boot/config/plugins/FabricRouting/FabricRouting.cfg
; See DOCS.md and docs/boot-lifecycle.md.

; Array start: install packages already on flash (sha256-verified, no network).
install_on_start="yes"

; Package channel from packages/manifest.json: latest | previous
package_channel="latest"

; Empty = package URLs from the bundled catalog. Otherwise an https mirror that
; serves the same file names. Hashes always come from the bundled catalog.
package_base_url=""

; Core daemons
enable_zebra="yes"
enable_fabricd="yes"
enable_staticd="yes"

; Optional protocols (off by default)
enable_bgpd="no"
enable_ospfd="no"
enable_ospf6d="no"
enable_isisd="no"
enable_bfdd="no"

; Start or restart FRR after Apply, package jobs and array start
start_frr="yes"

; Fabric route guard: OpenFabric routes outside these prefixes are not installed
fabric_guard="yes"
fabric_guard_v4="10.254.0.0/16 10.255.0.0/16"
fabric_guard_v6="fc00::/7"
