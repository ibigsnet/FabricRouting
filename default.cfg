; UnraidFRR — fully automated FRR management (Nvidia-driver style)
; Live: /boot/config/plugins/UnraidFRR/UnraidFRR.cfg
; Users select options only; plugin downloads, verifies, installpkg, starts FRR.

; Rehydrate FRR into RAM on array start
install_on_start="yes"

; Download catalog + packages automatically (no manual package drops)
auto_download="yes"

; Package channel from packages/manifest.json: latest | previous
package_channel="latest"

; Empty = official catalog on GitHub (packages/manifest.json)
package_base_url=""

; Core daemons
enable_zebra="yes"
enable_fabricd="yes"
enable_staticd="yes"

; Optional protocols (off by default)
enable_bgpd="no"
enable_ospfd="no"
enable_ospf6d="no"
enable_isisd="no"
enable_bfdd="no"

; Start/restart FRR after install
start_frr="yes"
