; UnraidFRR — Fabric Routing (FRR)
; Live: /boot/config/plugins/UnraidFRR/UnraidFRR.cfg
;
; Lifecycle (Unraid best practice — RAM OS + flash plugins):
;   Boot `plugin install`  → deploy plugin files only (no package download).
;   Array start            → rehydrate packages ALREADY on flash (install_on_start).
;   Settings → Apply       → optional catalog download + install (auto_download).
; See docs/boot-lifecycle.md

; Rehydrate FRR from flash packages into RAM when the array starts (no network).
install_on_start="yes"

; Download catalog + packages when user clicks Apply (not at boot).
; Default No = safer (no surprise multi‑MB fetch). First install: set Yes once, Apply,
; then you can leave No and rely on flash cache + install_on_start.
auto_download="no"

; Package channel from packages/manifest.json: latest | previous
package_channel="latest"

; Empty = official catalog on GitHub (packages/manifest.json)
package_base_url=""

; Core daemons
enable_zebra="yes"
enable_fabricd="yes"
enable_staticd="yes"

; Optional protocols (off by default)
enable_bgpd="no"
enable_ospfd="no"
enable_ospf6d="no"
enable_isisd="no"
enable_bfdd="no"

; Start/restart FRR after install/rehydrate
start_frr="yes"
