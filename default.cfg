; UnraidFRR — FRRouting package + daemon management (standalone)
; Live: /boot/config/plugins/UnraidFRR/UnraidFRR.cfg

; Re-run installpkg from packages/ on array start when binaries missing
install_on_start="yes"

; Enable core daemons in /etc/frr/daemons after packages are live
enable_zebra="yes"
enable_fabricd="yes"

; Other FRR daemons default off (opt-in; more surface area)
enable_bgpd="no"
enable_ospfd="no"
enable_ospf6d="no"
enable_isisd="no"
enable_bfdd="no"
enable_staticd="yes"

; Auto-download from package_base_url (reserved; leave no until releases host packages)
auto_download="no"
package_base_url=""

; After successful install, try to start/reload FRR
start_frr="yes"
